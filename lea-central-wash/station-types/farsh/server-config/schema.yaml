version: 1
entities:
  orders:
    table: farsh_orders
    fields:
      station_id:
        type: int
      internal_id:
        type: varchar(64)
        optional: true
      external_id:
        type: varchar(64)
        optional: true
      cash_desk_number:
        type: int
        optional: true
      amount:
        type: numeric
      status:
        type: text
      items:
        type: text

  categories:
    table: farsh_menu_categories
    fields:
      code:
        type: varchar(50)
        uniquePerType: true
      display_name_ru:
        type: varchar(255)
      display_name_kz:
        type: varchar(255)
      display_name_en:
        type: varchar(255)
      description_ru:
        type: text
        optional: true
      description_kz:
        type: text
        optional: true
      description_en:
        type: text
        optional: true
      image_b64:
        type: text
        optional: true
      image_url:
        type: text
        optional: true
      sort_order:
        type: int
      is_active:
        type: boolean
      is_approved:
        type: boolean
    relations:
      contains:
        type: many_to_many
        target: products
        through: farsh_categories_contains_products
        fields:
          sort_order: int

  sizes:
    table: farsh_sizes
    fields:
      code:
        type: varchar(50)
        uniquePerType: true
      display_name_ru:
        type: varchar(100)
        optional: true
      display_name_kz:
        type: varchar(100)
        optional: true
      description_ru:
        type: text
        optional: true
      description_kz:
        type: text
        optional: true
      is_active:
        type: boolean
      is_approved:
        type: boolean

  products:
    table: farsh_menu_items
    fields:
      code:
        type: varchar(50)
        uniquePerType: true
      external_id:
        type: varchar(64)
        optional: true
      sku:
        type: varchar(50)
        optional: true
      type:
        type: varchar(30)
      display_name_ru:
        type: varchar(1000)
      display_name_kz:
        type: varchar(1000)
      display_name_en:
        type: varchar(1000)
      description_ru:
        type: text
        optional: true
      description_kz:
        type: text
        optional: true
      description_en:
        type: text
        optional: true
      price:
        type: numeric
        optional: true
      old_price:
        type: numeric
        optional: true
      picture_b64:
        type: text
        optional: true
      picture_url:
        type: text
        optional: true
      is_active:
        type: boolean
      is_approved:
        type: boolean
      is_hidden:
        type: boolean
        optional: true
    history:
      - field: price
        type: numeric
    relations:
      sizes:
        type: many_to_many
        target: sizes
        through: farsh_product_sizes
        fields:
          price: numeric
          old_price: numeric
          external_size_id: varchar(64)
          size_name_ru: varchar(100)
          size_name_kz: varchar(100)
          is_default: boolean
          sort_order: int
          is_hidden: boolean
      modifiers:
        type: many_to_many
        target: products
        through: farsh_product_modifiers
        fields:
          group_code: varchar(50)
          group_name_ru: varchar(255)
          group_name_kz: varchar(255)
          group_name_en: varchar(255)
          external_group_id: varchar(64)
          applies_to_size_external_id: varchar(64)
          min_quantity: int
          max_quantity: int
          group_min_quantity: int
          group_max_quantity: int
          default_quantity: int
          hide_if_default: boolean
          price_override: numeric
          is_default: boolean
          included_free: boolean
      recommendations:
        type: many_to_many
        target: products
        through: farsh_product_recommendations
        fields:
          sort_order: int
          is_active: boolean

  combos:
    table: farsh_combos
    fields:
      code:
        type: varchar(50)
        uniquePerType: true
      external_id:
        type: varchar(64)
        optional: true
      display_name_ru:
        type: varchar(1000)
      display_name_kz:
        type: varchar(1000)
      description_ru:
        type: text
        optional: true
      description_kz:
        type: text
        optional: true
      price:
        type: numeric
      picture_b64:
        type: text
        optional: true
      picture_url:
        type: text
        optional: true
      is_active:
        type: boolean
      is_approved:
        type: boolean
    history:
      - field: price
        type: numeric
    relations:
      contains:
        type: many_to_many
        target: products
        through: farsh_combos_contains_products
        fields:
          group_code: varchar(50)
          group_name_ru: varchar(255)
          group_name_kz: varchar(255)
          external_group_id: varchar(64)
          min_select: int
          max_select: int
          quantity: int
          product_size_id: bigint
          price_delta: numeric
          is_required: boolean

  stop_list:
    table: farsh_stop_list
    fields:
      key:
        type: varchar(150)
        uniquePerType: true
      external_product_id:
        type: varchar(64)
      external_size_id:
        type: varchar(64)
        optional: true
      terminal_group_id:
        type: varchar(64)
        optional: true
      is_stopped:
        type: boolean
      source_revision:
        type: bigint
        optional: true
      valid_to:
        type: timestamptz
        optional: true
