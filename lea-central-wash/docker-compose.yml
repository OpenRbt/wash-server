version: "3.9"

volumes:
  pg_db_data:
    driver: local
  prometheus_data:
    driver: local
  minio_data:
    driver: local
  grafana_data:
    driver: local

services:
  hal:
    image: r.open-rbt.com/lcw-hal:v0.0.24
    container_name: hal
    ports:
      - "8099:8099"
    restart: always
    cap_add:
      - ALL
    networks:
      washnet:
        ipv4_address: 10.5.0.12
    device_cgroup_rules:
      - "c 188:* rmw"
      - "c 166:* rmw"
    volumes:
      - "/dev:/dev:ro"
      - "/run/udev:/run/udev:ro"
    group_add:
      - dialout
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
 
  storage:
    image: r.open-rbt.com/lcw-storage:v0.0.64
    container_name: storage
    ports:
      - "8020:8020"
    restart: always
    environment:
      STORAGE_DB_HOST: lcw-pg
      STORAGE_DB_NAME: wash
      STORAGE_DB_USER: wash
      STORAGE_DB_PASS: adm-pass-test
      STORAGE_KASSE_ENDPOINT: https://online-kasse:8443
      STORAGE_HAL_ENDPOINT: hal:8099
      STORAGE_START_DELAY: 0
      STORAGE_KEY_SSH_PATH: /app/ssh/id_rsa
      STORAGE_STATIONS_DIR_PATH: /app/stations
      STORAGE_MINIO_ENDPOINT: minio:9000
      STORAGE_MINIO_ACCESS_KEY: minioadmin
      STORAGE_MINIO_SECRET_KEY: minioadmin
      STORAGE_MINIO_BUCKET: firmware
      STORAGE_STATION_TYPES_DIR_PATH: /app/station-types
      STORAGE_API_READ_TIMEOUT: 10
      STORAGE_API_WRITE_TIMEOUT: 30
    cap_add:
      - ALL
    networks:
      washnet:
        ipv4_address: 10.5.0.10
    depends_on:
      postgres:
        condition: service_healthy
      hal:
        condition: service_started
      minio:
        condition: service_started
    device_cgroup_rules:
      - "c 188:* rmw"
    volumes:
      - "/dev:/dev:ro"
      - "/run/udev:/run/udev:ro"
      - "./stations:/app/stations"
      - "./ssh:/app/ssh"
      - "/etc/machine-id:/etc/machine-id:ro"
      - "./station-types:/app/station-types"
    group_add:
      - dialout
    dns:
      - 8.8.8.8
      - 1.1.1.1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  online-kasse:
    image: r.open-rbt.com/lcw-kasse:v0.0.8
    container_name: kasse
    ports:
      - "8443:8443"
    restart: always
    device_cgroup_rules:
      - "c 189:* rmw"
    volumes:
      - "/dev:/dev:ro"
      - "/run/udev:/run/udev:ro"
    cap_add:
      - ALL
    networks:
      washnet:
        ipv4_address: 10.5.0.11
    group_add:
      - dialout
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
        compress: "true"
 
  postgres:
    image: r.open-rbt.com/postgres:13
    container_name: lcw-pg
    restart: always
    volumes:
      - /var/db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: wash
      POSTGRES_USER: wash
      POSTGRES_PASSWORD: adm-pass-test
    networks:
      washnet:
        ipv4_address: 10.5.0.20
    healthcheck:
      test:
        [ "CMD-SHELL", "pg_isready -U wash -d wash" ]
      interval: 10s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
  
