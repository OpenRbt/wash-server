  updater:
    image: r.open-rbt.com/updater:0.0.4
    container_name: updater
    restart: always
    environment:
      LOG_DIR: ./logs
    networks:
      washnet:
        ipv4_address: 10.5.0.22
    pid: host
    privileged: true
    depends_on:
      - storage
    volumes:
      - ../:/app/dir
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
        compress: "true"
  
  updater-helper:
    image: r.open-rbt.com/updater-helper:v0.0.1
    container_name: updater-helper
    pid: host
    privileged: true
    profiles:
      - manual
    volumes:
      - ./:/app/dir   
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
        compress: "true"

